<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>window.ICT_CLOUD_CONFIG={url:"https://cvpxdwychelulvbkpete.supabase.co",publishableKey:"sb_publishable_PlcoALnhFi1rRCDKG016hQ_VUHVYdwi",ownerId:"df5a36b6-8b71-4bff-a511-177c01e498f4"};</script>
  <title>ICT Entry Desk</title>
  <link rel="stylesheet" href="styles.css?v=7bc7d06998df">
  <script src="supabase-sdk.vendor.js?v=7bc7d06998df" defer></script>
  <script src="cloud-log.js?v=7bc7d06998df" defer></script>
  <script src="browser-log.js?v=7bc7d06998df" defer></script>
  <script src="cloud-backup.js?v=7bc7d06998df" defer></script>
  <script src="app.js?v=7bc7d06998df" defer></script>
  <script src="backup-ui.js?v=7bc7d06998df" defer></script>
  <script src="offline.js?v=7bc7d06998df" defer></script>
  <script>
    window.ictAssetLoadFailed=false;
    window.addEventListener('error',event=>{
      if(event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement)window.ictAssetLoadFailed=true;
    },true);
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button id="home-button" class="brand-button" type="button" aria-label="Choose entry model"><span class="brand-symbol" aria-hidden="true">▱</span><span>ICT Entry Desk</span></button>
      <button id="menu-button" class="header-button" type="button" aria-label="Menu" aria-controls="header-menu" aria-expanded="false">☰</button>
      <nav id="header-menu" class="header-menu" aria-label="Main menu" hidden>
        <button type="button" data-nav="home">Choose model</button>
        <button type="button" data-nav="new">New entry</button>
        <button type="button" data-nav="history">History</button>
      </nav>
    </header>
    <p id="asset-status" class="load-status" role="alert" hidden></p><p id="offline-status" class="load-status" role="status" hidden></p>
    <main id="screen" class="screen"><noscript><p class="load-status">ICT Entry Desk needs JavaScript to sign in and access your journal. Enable JavaScript, then reload.</p></noscript></main>
    <footer class="journal-tools" aria-label="Journal and account">
      <p class="test-notice">Signed-in reviews are saved to your private cloud journal after confirmation. An unfinished review is only a draft in this tab. Keep a private downloaded backup.</p>
      <div id="backup-actions" class="backup-actions" hidden><button id="export-backup" type="button">Export old local archive</button><button id="import-backup" type="button" hidden>Import old local archive</button><input id="backup-file" hidden type="file" accept="application/json,.json" aria-label="Choose old local backup JSON"><span id="cloud-backup-actions" hidden><button id="export-cloud-backup" type="button">Export cloud backup</button><button id="import-cloud-backup" type="button">Import cloud backup</button><input id="cloud-backup-files" type="file" multiple accept="application/json,.json" aria-label="Choose all cloud backup JSON parts"></span><span id="backup-status" role="status"></span></div>
      <p id="cloud-status" class="load-status" role="status">Connecting to your private journal…</p>
      <button id="cloud-sign-out" class="cloud-sign-out" type="button" hidden>Sign out here</button>
    </footer>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button id="nav-home" type="button" aria-label="Models" title="Models"><span class="nav-symbol" aria-hidden="true">⌂</span><span class="nav-label">Models</span></button>
      <button id="nav-new" class="nav-new" type="button" aria-label="New entry" title="New entry"><span class="nav-symbol" aria-hidden="true">+</span><span class="nav-label">New review</span></button>
      <button id="nav-history" type="button" aria-label="History" title="History"><span class="nav-symbol" aria-hidden="true">◷</span><span class="nav-label">History</span></button>
    </nav>
  </div>
  <script>
    window.addEventListener('load',()=>{
      if(!window.ictAssetLoadFailed && typeof window.entryCloudLog==='function' && window.ictCloudBootstrapComplete===true && document.querySelector('#screen h1'))return;
      const status=document.getElementById('asset-status');
      status.hidden=false;
      status.textContent='ICT Entry Desk did not finish loading. Reconnect and reload. Your cloud journal was not changed by this failed page load.';
    });
  </script>
</body>
</html>
